<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lokesh Nalabothula</title>
    <style>
        :root {
            color-scheme: dark;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Inter", "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            color: #f8fafc;
            background:
                radial-gradient(circle at 20% 20%, rgba(78, 118, 255, 0.34), transparent 28%),
                radial-gradient(circle at 80% 10%, rgba(0, 214, 170, 0.24), transparent 25%),
                linear-gradient(135deg, #07111d 0%, #111c2f 45%, #0b1d2f 100%);
            overflow: hidden;
        }

        .page-shell {
            position: relative;
            min-height: 100vh;
            padding: 2rem;
        }

        h1 {
            position: absolute;
            top: 2rem;
            left: 2rem;
            z-index: 4;
            margin: 0;
            max-width: 680px;
            font-size: clamp(2rem, 4vw, 4.25rem);
            line-height: 0.95;
            font-weight: 800;
            letter-spacing: -0.03em;
            text-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
        }

        .hero-scene {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
        }

        .image-holder {
            position: relative;
            width: min(320px, 32vw);
            aspect-ratio: 1 / 1;
            padding: 1rem;
            border-radius: 2rem;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.28);
            backdrop-filter: blur(18px);
            z-index: 2;
        }

        .image-holder::before {
            content: "";
            position: absolute;
            inset: 0.7rem;
            border-radius: 1.5rem;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.20), rgba(255, 255, 255, 0));
            pointer-events: none;
        }

        .image-holder img {
            position: relative;
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 1.4rem;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.2);
        }

        .image-holder.has-fallback {
            display: grid;
            place-items: center;
        }

        .image-holder.has-fallback::after {
            content: "LN";
            position: relative;
            z-index: 2;
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: 0.22em;
            color: white;
        }

        .connections {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .connections path {
            fill: none;
            stroke: rgba(255, 255, 255, 0.82);
            stroke-width: 2.2;
            stroke-dasharray: 4 6;
            stroke-linecap: round;
        }

        .orbit-links {
            position: absolute;
            inset: 0;
            margin: 0;
            padding: 0;
            list-style: none;
            z-index: 3;
        }

        .orbit-links li {
            position: absolute;
        }

        .orbit-links li a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 170px;
            padding: 0.9rem 1.2rem;
            border-radius: 999px;
            text-decoration: none;
            color: #ffffff;
            background: rgba(15, 23, 42, 0.62);
            border: 1px solid rgba(255, 255, 255, 0.16);
            box-shadow: 0 14px 30px rgba(0, 0, 0, 0.24);
            backdrop-filter: blur(10px);
            font-weight: 600;
            transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
        }

        .orbit-links li a:hover {
            transform: translateY(-4px);
            background: rgba(33, 45, 74, 0.78);
            box-shadow: 0 18px 35px rgba(0, 0, 0, 0.3);
        }

        .link-1 {
            top: 16%;
            left: 17%;
        }

        .link-2 {
            top: 16%;
            right: 17%;
        }

        .link-3 {
            bottom: 16%;
            left: 50%;
            transform: translateX(-50%);
        }

        @media (max-width: 820px) {
            .page-shell {
                padding: 1.25rem;
                display: flex;
                flex-direction: column;
                justify-content: center;
            }

            h1 {
                position: relative;
                top: auto;
                left: auto;
                margin-bottom: 1.25rem;
            }

            .hero-scene {
                position: relative;
                inset: auto;
                min-height: 70vh;
            }

            .image-holder {
                width: min(280px, 72vw);
            }

            .link-1 {
                top: 10%;
                left: 6%;
            }

            .link-2 {
                top: 10%;
                right: 6%;
            }

            .link-3 {
                bottom: 10%;
                left: 50%;
            }
        }
    </style>
</head>
<body>
    <main class="page-shell">
        <h1>Welcome to Lokesh Nalabothula</h1>

        <section class="hero-scene" aria-label="Personal portfolio hero">
            <svg class="connections" viewBox="0 0 100 100" aria-hidden="true">
                <path d="M 18 22 C 30 18, 40 18, 46 38" />
                <path d="M 82 22 C 70 18, 60 18, 54 38" />
                <path d="M 50 78 C 50 68, 50 60, 50 54" />
            </svg>

            <div class="image-holder">
                <img
                    src="hero.jpg"
                    alt="Portrait of Lokesh Nalabothula"
                    onerror="this.style.display='none'; this.parentElement.classList.add('has-fallback');"
                >
            </div>

            <ol class="orbit-links">
                <li class="link-1">
                    <a href="youtuber.html">Youtuber</a>
                </li>
                <li class="link-2">
                    <a href="instagraminfluencer.html">Instagram Influencer</a>
                </li>
                <li class="link-3">
                    <a href="cybersecurityenthusiast.html">Cyber Security Enthusiast</a>
                </li>
            </ol>
        </section>
    </main>
</body>
</html>
